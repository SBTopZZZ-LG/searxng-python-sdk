name: Lint & Test

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.9"
      searxng-image:
        required: false
        type: string
        default: "searxng/searxng:2026.5.10-df1f24fb7"
      post-pr-comment:
        required: false
        type: boolean
        default: true
      upload-coverage:
        required: false
        type: boolean
        default: true
    secrets:
      codecov_token:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    services:
      searxng:
        image: ${{ inputs.searxng-image }}
        ports:
          - 8080:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for SearXNG
        run: timeout 60 bash -c 'until curl -sf http://localhost:8080; do sleep 2; done'

      - name: Run tests with coverage
        id: pytest
        env:
          SEARXNG_BASE_URL: http://localhost:8080
        run: |
          set +e
          pytest tests/ --cov=searxng_search --cov-report=xml --cov-report=term-missing 2>&1 | tee pytest-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          exit ${PIPESTATUS[0]}

      - name: Build report
        if: always()
        run: |
          EXIT_CODE="${{ steps.pytest.outputs.exit_code }}"
          if [ "$EXIT_CODE" = "0" ]; then
            STATUS="✅ Tests passed"
          else
            STATUS="❌ Tests failed (exit code $EXIT_CODE)"
          fi

          # Job Summary
          {
            echo "## Test Results"
            echo "$STATUS"
            echo ""
            echo "<details><summary>pytest output</summary>"
            echo ""
            echo '```'
            cat pytest-output.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "## Coverage Report"
            coverage report --format=markdown 2>/dev/null || echo "_Coverage data unavailable._"
          } >> $GITHUB_STEP_SUMMARY

          # PR comment file
          {
            echo "## Test Results"
            echo "$STATUS"
            echo ""
            echo "<details><summary>pytest output</summary>"
            echo ""
            echo '```'
            cat pytest-output.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "## Coverage Report"
            coverage report --format=markdown 2>/dev/null || echo "_Coverage data unavailable._"
          } > pr-comment.md

      - name: Post comment on PR
        if: always() && github.event_name == 'pull_request' && inputs.post-pr-comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: pr-comment.md

      - name: Upload coverage to Codecov
        if: always() && inputs.upload-coverage && env.CODECOV_TOKEN != '' && github.event.pull_request.head.repo.fork == false
        env:
          CODECOV_TOKEN: ${{ secrets.codecov_token }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.codecov_token }}

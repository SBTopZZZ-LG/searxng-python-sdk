name: Lint & Test

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linter
        run: ruff check .

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, format]
    services:
      searxng:
        image: searxng/searxng:latest
        ports:
          - 8080:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for SearXNG
        run: timeout 60 bash -c 'until curl -sf http://localhost:8080; do sleep 2; done'

      - name: Run tests with coverage
        env:
          SEARXNG_BASE_URL: http://localhost:8080
        run: pytest tests/ --cov=searxng_search --cov-report=xml --cov-report=term-missing

      - name: Generate coverage report
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
          echo "## Coverage Report" > coverage-report.md
          coverage report --format=markdown >> coverage-report.md

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: coverage-report.md

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["searxng_search"]

[project]
name = "searxng_python_sdk"
version = "1.0.0"
description = "An Unofficial Python SDK for interacting with SearXNG instances"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13.0,<2.14.0",
  "httpx>=0.28.1,<0.29.0",
  "beautifulsoup4>=4.14.3,<4.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-asyncio>=0.25.0,<1.0.0",
  "ruff>=0.9.0,<1.0.0",
  "pre-commit>=4.0.0,<5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/searxng_search", "tests/integration"]
asyncio_mode = "auto"
markers = [
  "integration: marks tests as integration tests requiring a live SearXNG instance (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pylint.messages_control]
disable = ["redefined-outer-name", "line-too-long"]
